<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Mallas Low Poly 3D</title>

    <!-- PWA Config & Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LowPoly3D">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%236366f1'><rect width='512' height='512' rx='100' fill='%230f172a'/><path d='M256 96L384 192L256 288L128 192Z' fill='%23818cf8'/><path d='M128 192L256 288V416L128 320Z' fill='%234f46e5'/><path d='M384 192L256 288V416L384 320Z' fill='%236366f1'/></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-white font-sans antialiased select-none">

    <!-- Visor 3D -->
    <div id="canvas-container"></div>

    <!-- Panel de Control (UI) -->
    <div class="absolute top-4 left-4 z-10 w-80 max-h-[92vh] overflow-y-auto bg-slate-900/95 backdrop-blur border border-slate-700 p-5 rounded-2xl shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-slate-700 pb-3">
            <h1 class="text-lg font-bold text-indigo-400">Low Poly 3D Generator</h1>
            <span id="statusBadge" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-semibold">Listo</span>
        </div>
        
        <!-- Cargar Imagen y Miniatura -->
        <div>
            <label class="block text-xs font-semibold mb-2 text-slate-300 uppercase tracking-wider">Cargar Imagen</label>
            <div class="flex items-center space-x-3">
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <button onclick="document.getElementById('imageInput').click()" class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-xs font-medium text-slate-200 transition text-center cursor-pointer">
                    📁 Seleccionar Imagen
                </button>
                <div class="w-10 h-10 rounded-lg overflow-hidden border border-slate-700 bg-slate-800 flex-shrink-0">
                    <img id="imagePreview" class="w-full h-full object-cover hidden" alt="Vista previa">
                </div>
            </div>
        </div>

        <!-- Resolución / Cantidad de polígonos -->
        <div>
            <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300 font-medium">Polígonos (Resolución)</span>
                <span id="polyVal" class="text-indigo-400 font-bold">24 x 24</span>
            </div>
            <input type="range" id="polyGrid" min="8" max="80" step="2" value="24" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <!-- Profundidad / Extrusión -->
        <div>
            <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300 font-medium">Relieve 3D (Extrusión)</span>
                <span id="depthVal" class="text-indigo-400 font-bold">15</span>
            </div>
            <input type="range" id="depthRange" min="0" max="60" step="1" value="15" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <!-- Invertir Altura -->
        <div class="flex items-center justify-between pt-1">
            <span class="text-xs text-slate-300 font-medium">Invertir Relieve</span>
            <input type="checkbox" id="invertToggle" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer">
        </div>

        <!-- Modo de Renderizado -->
        <div class="space-y-2 pt-2 border-t border-slate-800">
            <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                <input type="checkbox" id="wireframeToggle" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
                <span>Ver Malla de Alambre (Wireframe)</span>
            </label>
            <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                <input type="checkbox" id="flatShadingToggle" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
                <span>Efecto Facetado Low Poly (Flat Shading)</span>
            </label>
        </div>

        <!-- Botón para exportar .OBJ -->
        <button id="exportBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 font-semibold text-sm rounded-xl shadow-lg transition duration-150 flex items-center justify-center space-x-2 cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span>Exportar Modelo (.OBJ)</span>
        </button>
        
        <p class="text-[11px] text-slate-400 text-center">Rotar: Clic izq + arrastrar | Zoom: Rueda ratón | Desplazar: Clic der</p>
    </div>

    <!-- Script principal -->
    <script src="script.js"></script>

    <!-- Registro del Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch((err) => console.error('Error al registrar el Service Worker:', err));
            });
        }
    </script>
</body>
</html>
